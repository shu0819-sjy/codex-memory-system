name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q codex_memory tests hooks

      - name: Run unit and public template privacy tests
        run: python -m unittest discover -v

      - name: Check template without modifying it
        run: python -m codex_memory check --root memory

      - name: Check POSIX wrapper syntax
        if: runner.os != 'Windows'
        run: sh -n ./codex-memory

      - name: Smoke test install, update and platform wrapper
        run: python scripts/install_smoke.py
